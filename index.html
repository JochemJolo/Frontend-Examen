<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta name="description" content="This is a Robotics shop where you can purchase all of your missing Robotics items">
    <meta name="robot" content="index, follow">
    <meta name="google-site-verification" content="BapB3wlmIc5D7Tt1QoahmiWDCMxQPWpmn4V3-oEMi4I" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="topNavBar">
        <img class="logo" width="70" height="50" src="images/robodog3.png" alt="RoboDog">
        <div class="navigation">
            <ul class="navigationContainer">
                <li><a href="#" onclick="VisibilityChange('Home'); return false;">Home</a></li>
                <li><a href="#" onclick="VisibilityChange('Products'); return false;">Products</a></li>
                <li><a href="#" onclick="VisibilityChange('ContactPage'); return false;">Contact</a></li>
            </ul>
        </div>
    </div>

    <div class="middleContainer Home">
        <div class="Text-Middle">
            <h3 class="introduction" id="company-name">Goeden dag, wij zijn van @Robotica.</h3><br>
            <h3>Hier kunt u allemaal dingen kopen die gaan over Robotica.</h3><br>
            <h3>Zoals een mooie auto, of zo'n geweldige ventilator die op zonne energie loopt</h3><br>
        </div>
    </div>

    <div class="middleContainer Products Hidden">
        <ul class="Box-List" id="itemcontainer"></ul>
    </div>

    <div class="middleContainer ContactPage Hidden">
        <div class="Forum">
            <form class="Forum" id="forumThing" action="">
                <textarea name="" id="" placeholder="Naam"></textarea>
                <textarea name="" id="" placeholder="E-mail adress"></textarea>
                <textarea name="" id="vraag" placeholder="Uw vraag"></textarea>
                <button>Submit</button>
            </form>
        </div>
    </div>

    <div class="bottomBar">
        <div class="bottomText" id="company-name">@Robotica is only allowed to be used by this company</div>
    </div>

    <dialog id="itemDialog">
        <img id="dialogImg" src="" alt="">
        <h3 id="dialogName"></h3>
        <button id="dialogClose">Close</button>
    </dialog>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
